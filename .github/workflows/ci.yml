name: CI Specification & Invariant Verification

on:
  push:
    branches:
      - main
      - dev
      - 'fm/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  verify-specifications:
    name: Architecture & Invariant Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Specification Consistency & Invariant Tests
        run: |
          python -m unittest discover -s tests -v
